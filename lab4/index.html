<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的生活</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>我的生活</h1>
            <p class="subtitle">記錄日常的點點滴滴</p>
        </header>

        <section>
            <h2>我的興趣</h2>
            <ul class="lab-list">
                <li class="lab-card"><span class="number">✦</span><span class="label">玩遊戲</span></li>
                <li class="lab-card"><span class="number">✦</span><span class="label">畫畫</span></li>
                <li class="lab-card"><span class="number">✦</span><span class="label">看書</span></li>
            </ul>
        </section>

        <section>
            <h2>每日任務</h2>
            <ol class="lab-list">
                <li class="lab-card"><span class="number">01</span><span class="label">起床</span></li>
                <li class="lab-card"><span class="number">02</span><span class="label">工作</span></li>
                <li class="lab-card"><span class="number">03</span><span class="label">上課</span></li>
            </ol>
        </section>

        <section>
            <h2>我的課表</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>節次</th>
                            <th>時間</th>
                            <th>週一</th>
                            <th>週二</th>
                            <th>週三</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>第一節</td>
                            <td>08:10</td>
                            <td>數學</td>
                            <td>英文</td>
                            <td>國文</td>
                        </tr>
                        <tr>
                            <td>第二節</td>
                            <td>09:10</td>
                            <td>物理</td>
                            <td>化學</td>
                            <td>歷史</td>
                        </tr>
                        <tr>
                            <td>第三節</td>
                            <td>10:10</td>
                            <td>體育</td>
                            <td>生物</td>
                            <td>地理</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            <a href="../index.html" class="back-btn">← 回首頁</a>
        </footer>
    </div>
</body>
</html>
