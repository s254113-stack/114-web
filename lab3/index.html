<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 圖片展示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-container">
        <h1>AI 圖片展示</h1>

        <div class="image-grid">
            <div class="image-card">
                <img src="001.jpg" alt="特寫">
                <label>圖 1：近距離特寫</label>
                <p>取原圖主體的近距離特寫，畫面中有緩緩飄落的雪花。背景為模糊的雪林，營造柔和、靜謐的冬季氛圍。</p>
            </div>

            <div class="image-card">
                <img src="002.jpg" alt="背影">
                <label>圖 2：寬闊背影</label>
                <p>主角背對鏡頭站在雪地中央，腳印延伸至遠方，畫面留有大量負空間，展現寂靜與空靈的冬季景致。</p>
            </div>
        </div>

        <div class="footer-nav">
            <a href="https://youtu.be/6Fm-wW_57FY?si=8QikTB4loxqX-0U-" target="_blank">死別 (YouTube)</a>
            <a href="../index.html">回首頁</a>
        </div>
    </div>

</body>
</html>
